# Spring Boot Actuator 公共配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,loggers,threaddump,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
