# ⚠️ 警告：Nacos 配置是明文存储，任何能访问 Nacos 控制台的人
#          都能看到密钥。生产环境应考虑：
#          - 限制 Nacos 访问权限（仅运维团队）
#          - 启用 Nacos 访问日志
#          - 定期审计 Nacos 操作日志
# ============================================================

