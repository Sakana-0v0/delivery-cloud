server:
  port: 10006

spring:
  application:
    name: del-file
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: sakana
      config:
        server-addr: 127.0.0.1:8848
        namespace: sakana
        group: DEFAULT_GROUP
        file-extension: yml
  config:
    import:
      - optional:nacos:common-jwt.yml
      - optional:nacos:common-jackson.yml
      - optional:nacos:common-mybatis.yml
      - optional:nacos:common-actuator.yml
      - optional:nacos:del-file.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info
