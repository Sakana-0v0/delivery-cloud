server:
  port: 10002

spring:
  application:
    name: del-admin
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: sakana
      config:
        server-addr: 127.0.0.1:8848
        namespace: sakana
        group: DEFAULT_GROUP
        file-extension: yml
  config:
    import:
      - optional:nacos:common-jwt.yml
      - optional:nacos:common-redis.yml
      - optional:nacos:common-mybatis.yml
      - optional:nacos:common-actuator.yml
      - optional:nacos:del-admin.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sakana: DEBUG